{% extends 'base.html' %}
{% block title %}Create account · Lost Locker{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create an account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" value="{{ name }}" maxlength="100" autocomplete="name" required autofocus>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" maxlength="254" autocomplete="email" required>
    <label for="password">Password <span class="muted">(at least 8 characters)</span></label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <button type="submit" class="primary">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
</div>
{% endblock %}
