{% extends 'base.html' %}
{% block title %}Create account · Lost Locker{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create an account</h1>
  <p class="muted">So finders and owners can be put in touch. We never show your email publicly.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="name">Your name</label>
    <input id="name" name="name" type="text" value="{{ name }}" maxlength="100" autocomplete="name" required autofocus>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" maxlength="254" autocomplete="email" required>
    <label for="password">Password <span class="hint">At least 8 characters.</span></label>
    <div class="pwd-wrap">
      <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      <button type="button" data-toggle-password="password" aria-pressed="false" aria-label="Show password" hidden>Show</button>
    </div>
    <div class="actions"><button type="submit" class="primary big">Create account</button></div>
  </form>
  <p style="margin-top:1.25rem">Already have an account? <a href="{{ url_for('auth.login', next=next or None) }}">Log in</a>.</p>
</div>
{% endblock %}
